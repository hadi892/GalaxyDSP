name: GalaxyDSP CI/CD Build

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Validate Android DSP Framework
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1 & Validate Wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Run Android Lint Check
        run: gradle :app:lintDebug --stacktrace --no-daemon

      - name: Run DSP Mathematical & Receiver Unit Tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Assemble Release APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Upload GalaxyDSP-debug.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyDSP-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload GalaxyDSP-release.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyDSP-release.apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
